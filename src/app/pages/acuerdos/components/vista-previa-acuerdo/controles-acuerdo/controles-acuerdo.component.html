<!-- Barra de Controles Compacta (Ocultar al imprimir) -->
<div class="flex flex-col gap-2.5 pb-2.5 border-b border-slate-800/80 mb-3 shrink-0 print:hidden select-none">
  
  <!-- Fila 1: Título y Botones de Exportación -->
  <div class="flex items-center justify-between gap-4">
    <h2 class="text-xs font-bold text-slate-100 flex items-center gap-1.5 uppercase tracking-wider text-slate-400">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5 text-indigo-400">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25M9 16.5v.75m3-3v3m3-3v3m-10.125-3h14.25" />
      </svg>
      Acuerdo Municipal
    </h2>
    
    <div class="flex gap-1.5">
      <button 
        type="button" 
        (click)="exportWord.emit('docx')"
        class="btn btn-xs btn-primary rounded-xl cursor-pointer shadow-sm"
      >
        Word (DOCX)
      </button>
      <button 
        type="button" 
        (click)="exportWord.emit('doc')"
        class="btn btn-xs btn-outline rounded-xl cursor-pointer"
      >
        Word (DOC)
      </button>
      <button 
        type="button" 
        (click)="printPdf.emit()"
        class="btn btn-xs btn-outline rounded-xl cursor-pointer"
      >
        PDF (Imprimir)
      </button>
    </div>
  </div>

  <!-- Fila 2: Toggles de Vista, Tamaño de Hoja y Ajuste de Márgenes -->
  <div class="flex flex-wrap items-center justify-between gap-3 text-[10px]">
    
    <!-- Toggles de Modo -->
    <div class="flex gap-0.5 p-0.5 bg-slate-950/60 rounded-xl border border-slate-850">
      <button 
        (click)="activeTabChange.emit('preview')"
        [class]="'px-3 py-1 rounded-lg font-bold transition-all cursor-pointer ' + 
                 (activeTab() === 'preview' ? 'bg-indigo-650/20 text-indigo-350 border border-indigo-500/20' : 'text-slate-400 hover:text-slate-200 border border-transparent')"
      >
        Vista Previa
      </button>
      <button 
        (click)="activeTabChange.emit('editor')"
        [class]="'px-3 py-1 rounded-lg font-bold transition-all cursor-pointer ' + 
                 (activeTab() === 'editor' ? 'bg-indigo-650/20 text-indigo-350 border border-indigo-500/20' : 'text-slate-400 hover:text-slate-200 border border-transparent')"
      >
        Editor Libre
      </button>
    </div>

    <div class="flex items-center gap-2.5">
      <!-- Tamaño de Hoja -->
      <div class="flex items-center gap-1.5">
        <span class="font-bold text-slate-400">Hoja:</span>
        <select 
          [ngModel]="selectedPageSize()"
          (ngModelChange)="selectedPageSizeChange.emit($event)"
          class="select select-bordered select-xs bg-slate-950 text-slate-200 rounded-xl cursor-pointer outline-none font-bold text-[10px]"
        >
          <option value="letter">Carta (8.5"x11")</option>
          <option value="legal">Oficio (14")</option>
          <option value="foolscap">Oficio/Folio (13")</option>
          <option value="a4">A4</option>
        </select>
      </div>

      <!-- Botón Toggle Márgenes -->
      <button 
        type="button"
        (click)="showMarginsChange.emit(!showMargins())"
        [class]="'btn btn-xs cursor-pointer ' + 
                 (showMargins() ? 'btn-primary' : 'btn-outline')"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3 h-3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827a1.125 1.125 0 0 1 .26 1.43l-1.297 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.43l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.645-.869L9.594 3.94ZM12 15.75a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5Z" />
        </svg>
        Márgenes
      </button>
    </div>

  </div>

  <!-- Panel de Márgenes Colapsable -->
  @if (showMargins()) {
    <div class="p-2.5 bg-slate-950/40 border border-slate-850 rounded-xl flex items-center justify-between gap-4 text-[9px] animate-[fadeIn_0.15s_ease-out]">
      <span class="font-bold text-slate-500 uppercase tracking-wider">Márgenes (cm):</span>
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1">
          <span class="text-slate-550">Sup:</span>
          <input 
            type="number" 
            [ngModel]="marginTop()" 
            (ngModelChange)="marginTopChange.emit($event)"
            step="0.1" min="0" 
            class="input input-bordered input-xs w-10 bg-slate-900 text-slate-200 text-center rounded focus-visible:ring-2 focus-visible:ring-indigo-500/30 focus-visible:border-indigo-500 outline-none font-mono"
          />
        </div>
        <div class="flex items-center gap-1">
          <span class="text-slate-550">Inf:</span>
          <input 
            type="number" 
            [ngModel]="marginBottom()" 
            (ngModelChange)="marginBottomChange.emit($event)"
            step="0.1" min="0" 
            class="input input-bordered input-xs w-10 bg-slate-900 text-slate-200 text-center rounded focus-visible:ring-2 focus-visible:ring-indigo-500/30 focus-visible:border-indigo-500 outline-none font-mono"
          />
        </div>
        <div class="flex items-center gap-1">
          <span class="text-slate-550">Izq:</span>
          <input 
            type="number" 
            [ngModel]="marginLeft()" 
            (ngModelChange)="marginLeftChange.emit($event)"
            step="0.1" min="0" 
            class="input input-bordered input-xs w-10 bg-slate-900 text-slate-200 text-center rounded focus-visible:ring-2 focus-visible:ring-indigo-500/30 focus-visible:border-indigo-500 outline-none font-mono"
          />
        </div>
        <div class="flex items-center gap-1">
          <span class="text-slate-550">Der:</span>
          <input 
            type="number" 
            [ngModel]="marginRight()" 
            (ngModelChange)="marginRightChange.emit($event)"
            step="0.1" min="0" 
            class="input input-bordered input-xs w-10 bg-slate-900 text-slate-200 text-center rounded focus-visible:ring-2 focus-visible:ring-indigo-500/30 focus-visible:border-indigo-500 outline-none font-mono"
          />
        </div>
      </div>
    </div>
  }

</div>
