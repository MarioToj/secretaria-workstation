<div class="w-full flex flex-col gap-4 text-xs select-text">
  <form [formGroup]="invoiceForm" class="space-y-4">
    
    <!-- Grupo 1: Datos de Factura (Amber) -->
    <div class="border-l-3 border-amber-500/80 bg-amber-500/5 p-4 rounded-r-2xl space-y-3 shadow-md shadow-amber-950/5">
      <div class="flex items-center gap-1.5 text-amber-400 font-bold uppercase tracking-wider text-[10px]">
        <span aria-hidden="true">📄</span> Datos de Factura
      </div>
      
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1.5">
          <label [for]="'serie-' + factura()?.id" class="font-semibold text-slate-300">Serie</label>
          <input 
            [id]="'serie-' + factura()?.id"
            type="text" 
            formControlName="serie"
            autocomplete="off"
            spellcheck="false"
            class="input input-bordered input-sm w-full bg-slate-950 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-amber-500/30 focus-visible:border-amber-500 outline-none transition-all font-mono"
            placeholder="Ej: FEL…"
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label [for]="'numero-' + factura()?.id" class="font-semibold text-slate-300">Número</label>
          <input 
            [id]="'numero-' + factura()?.id"
            type="text" 
            formControlName="numero"
            autocomplete="off"
            spellcheck="false"
            class="input input-bordered input-sm w-full bg-slate-950 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-amber-500/30 focus-visible:border-amber-500 outline-none transition-all font-mono"
            placeholder="Ej: 123456789…"
          />
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label [for]="'dte-' + factura()?.id" class="font-semibold text-slate-300">DTE / UUID (Número Autorización)</label>
        <input 
          [id]="'dte-' + factura()?.id"
          type="text" 
          formControlName="dte"
          autocomplete="off"
          spellcheck="false"
          class="input input-bordered input-sm w-full bg-slate-950 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-amber-500/30 focus-visible:border-amber-500 outline-none transition-all font-mono"
          placeholder="Ej: F9F486AC-8E0E-4A9B…"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label [for]="'fecha-' + factura()?.id" class="font-semibold text-slate-300">Fecha de Emisión</label>
        <input 
          [id]="'fecha-' + factura()?.id"
          type="text" 
          formControlName="fecha"
          autocomplete="off"
          class="input input-bordered input-sm w-full bg-slate-950 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-amber-500/30 focus-visible:border-amber-500 outline-none transition-all"
          placeholder="Ej: 12 de marzo de 2025…"
        />
      </div>
    </div>

    <!-- Grupo 2: Establecimiento y Propietario (Cyan) -->
    <div class="border-l-3 border-cyan-500/80 bg-cyan-500/5 p-4 rounded-r-2xl space-y-3 shadow-md shadow-cyan-950/5">
      <div class="flex items-center gap-1.5 text-cyan-400 font-bold uppercase tracking-wider text-[10px]">
        <span aria-hidden="true">🏢</span> Datos del Negocio y Propietario
      </div>

      <div class="flex flex-col gap-1.5">
        <label [for]="'establecimiento-' + factura()?.id" class="font-semibold text-slate-300">Nombre del Establecimiento</label>
        <input 
          [id]="'establecimiento-' + factura()?.id"
          type="text" 
          formControlName="establecimiento"
          autocomplete="off"
          class="input input-bordered input-sm w-full bg-slate-950 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-cyan-500/30 focus-visible:border-cyan-500 outline-none transition-all"
          placeholder="Ej: Comercial La Bendición…"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label [for]="'direccion-' + factura()?.id" class="font-semibold text-slate-300">Dirección</label>
        <input 
          [id]="'direccion-' + factura()?.id"
          type="text" 
          formControlName="direccion"
          autocomplete="off"
          class="input input-bordered input-sm w-full bg-slate-950 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-cyan-500/30 focus-visible:border-cyan-500 outline-none transition-all"
          placeholder="Ej: 4ta. Avenida 3-21, Zona 1…"
        />
      </div>

      <div class="grid grid-cols-3 gap-2">
        <div class="col-span-2 flex flex-col gap-1.5">
          <label [for]="'dueno-' + factura()?.id" class="font-semibold text-slate-300">Propietario / Dueño</label>
          <input 
            [id]="'dueno-' + factura()?.id"
            type="text" 
            formControlName="dueno"
            autocomplete="off"
            class="input input-bordered input-sm w-full bg-slate-950 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-cyan-500/30 focus-visible:border-cyan-500 outline-none transition-all"
            placeholder="Ej: Juan Pérez Gómez…"
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label [for]="'tratamientoDueno-' + factura()?.id" class="font-semibold text-slate-300">Tratamiento</label>
          <select 
            [id]="'tratamientoDueno-' + factura()?.id"
            formControlName="tratamientoDueno"
            class="select select-bordered select-sm w-full bg-slate-950 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-cyan-500/30 focus-visible:border-cyan-500 outline-none transition-all cursor-pointer"
          >
            <option value="del señor">del señor</option>
            <option value="de la señora">de la señora</option>
            <option value="de">de (Empresas/Sociedades)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Grupo 3: Solicitantes / COCODE (Emerald) -->
    <div class="border-l-3 border-emerald-500/80 bg-emerald-500/5 p-4 rounded-r-2xl space-y-3 shadow-md shadow-emerald-950/5">
      <div class="flex items-center gap-1.5 text-emerald-400 font-bold uppercase tracking-wider text-[10px]">
        <span aria-hidden="true">👥</span> Solicitantes
      </div>

      <div class="grid grid-cols-[90px_1fr] gap-3">
        <div class="flex flex-col gap-1.5">
          <label [for]="'prefijoSolicitantes-' + factura()?.id" class="font-semibold text-slate-300">Prefijo</label>
          <select 
            [id]="'prefijoSolicitantes-' + factura()?.id"
            formControlName="prefijoSolicitantes"
            class="select select-bordered select-sm w-full bg-slate-950 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-emerald-500/30 focus-visible:border-emerald-500 outline-none transition-all cursor-pointer"
          >
            <option value="de">de</option>
            <option value="del">del</option>
            <option value="de la">de la</option>
            <option value="los">los</option>
            <option value="las">las</option>
          </select>
        </div>

        <div class="flex flex-col gap-1.5">
          <label [for]="'solicitantes-' + factura()?.id" class="font-semibold text-slate-300">Miembros del COCODE / Solicitantes</label>
          <textarea 
            [id]="'solicitantes-' + factura()?.id"
            formControlName="solicitantes"
            rows="3"
            class="textarea textarea-bordered textarea-sm w-full bg-slate-950 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-emerald-500/30 focus-visible:border-emerald-500 outline-none transition-all resize-y leading-relaxed"
            placeholder="Ej: Manuel Lopez Mejía, Presidente del COCODE de Caserío Piedras Blancas…"
          ></textarea>
        </div>
      </div>
    </div>

    <!-- Grupo 4: Productos / Conceptos (Purple) -->
    <div class="border-l-3 border-purple-500/80 bg-purple-500/5 p-4 rounded-r-2xl space-y-3 shadow-md shadow-purple-950/5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5 text-purple-400 font-bold uppercase tracking-wider text-[10px]">
          <span aria-hidden="true">🛍️</span> Detalle de Productos
        </div>
        <button 
          type="button" 
          (click)="addProductRow()"
          aria-label="Añadir producto"
          class="btn btn-xs btn-outline btn-secondary border-dashed rounded-xl cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3 h-3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          + Producto
        </button>
      </div>

      <div class="space-y-3" formArrayName="productos">
        @for (prodGroup of productos.controls; track i; let i = $index) {
          <div [formGroupName]="i" class="p-4 bg-slate-950 border border-slate-900 rounded-2xl relative space-y-3 shadow-inner shadow-black/40">
            <button 
              type="button" 
              (click)="removeProductRow(i)"
              aria-label="Eliminar producto"
              class="btn btn-xs btn-ghost text-slate-500 hover:text-red-400 absolute top-2 right-2 rounded-lg cursor-pointer"
              title="Eliminar producto"
            >
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>

            <!-- Cantidad y Descripción -->
            <div class="grid grid-cols-5 gap-2">
              <div class="flex flex-col gap-1.5 col-span-1">
                <label [for]="'cantidad-' + factura()?.id + '-' + i" class="text-[9px] font-bold text-slate-500 uppercase">Cant.</label>
                <input 
                  [id]="'cantidad-' + factura()?.id + '-' + i"
                  type="number" 
                  formControlName="cantidad"
                  min="1"
                  class="input input-bordered input-sm w-full bg-slate-900 text-slate-200 rounded-xl text-center focus-visible:ring-2 focus-visible:ring-purple-500/30 focus-visible:border-purple-500 outline-none font-mono"
                />
              </div>
              <div class="col-span-4 flex flex-col gap-1.5">
                <label [for]="'descripcion-' + factura()?.id + '-' + i" class="text-[9px] font-bold text-slate-500 uppercase">Descripción del Bien/Servicio</label>
                <input 
                  [id]="'descripcion-' + factura()?.id + '-' + i"
                  type="text" 
                  formControlName="descripcion"
                  autocomplete="off"
                  class="input input-bordered input-sm w-full bg-slate-900 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-purple-500/30 focus-visible:border-purple-500 outline-none"
                  placeholder="Ej: Compra de tubería PVC…"
                />
              </div>
            </div>

            <!-- Precio y Género de Producto -->
            <div class="grid grid-cols-2 gap-2 pt-1">
              <div class="flex flex-col gap-1.5">
                <label [for]="'precioUnitario-' + factura()?.id + '-' + i" class="text-[9px] font-bold text-slate-500 uppercase">P. Unitario (Q.)</label>
                <input 
                  [id]="'precioUnitario-' + factura()?.id + '-' + i"
                  type="number" 
                  formControlName="precioUnitario"
                  step="0.01"
                  min="0"
                  class="input input-bordered input-sm w-full bg-slate-900 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-purple-500/30 focus-visible:border-purple-500 outline-none font-mono"
                />
              </div>
              <div class="flex flex-col gap-1.5">
                <label [for]="'genero-' + factura()?.id + '-' + i" class="text-[9px] font-bold text-slate-500 uppercase">Género Gramatical</label>
                <select 
                  [id]="'genero-' + factura()?.id + '-' + i"
                  formControlName="genero"
                  class="select select-bordered select-sm w-full bg-slate-900 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-purple-500/30 focus-visible:border-purple-500 outline-none cursor-pointer"
                >
                  <option value="masculino">cada uno (masc.)</option>
                  <option value="femenino">cada una (fem.)</option>
                </select>
              </div>
            </div>
          </div>
        }
      </div>
    </div>

    <!-- Total de la Factura -->
    <div class="bg-gradient-to-r from-slate-950 to-indigo-950/40 border border-indigo-500/15 p-4 rounded-2xl flex items-center justify-between shadow-lg shadow-black/10">
      <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Total de esta Factura:</span>
      <span class="text-base font-extrabold text-indigo-400 font-mono">Q.{{ calculateTotal().toLocaleString('en-US', { minimumFractionDigits: 2 }) }}</span>
    </div>
  </form>
</div>
