<div 
  (dragover)="onDragOver($event)" 
  (dragleave)="onDragLeave()" 
  (drop)="onDrop($event)"
  [class.border-indigo-500]="isDragOver()"
  [class.bg-indigo-950/20]="isDragOver()"
  class="bg-slate-900/60 backdrop-blur-md border border-slate-800/85 rounded-3xl p-5 shadow-2xl flex flex-col gap-4 shrink-0 transition-all duration-300 relative hover:border-slate-800"
>
  @if (isDragOver()) {
    <div class="absolute inset-0 bg-slate-900/90 border-2 border-dashed border-indigo-500 rounded-3xl flex flex-col items-center justify-center gap-2 z-50 text-indigo-400 pointer-events-none">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-10 h-10 animate-bounce">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" />
      </svg>
      <span class="text-xs font-bold uppercase tracking-wider">¡Suelta los PDFs de facturas aquí!</span>
    </div>
  }

  <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
    <div class="flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-indigo-400">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
      </svg>
      <h3 class="text-sm font-bold text-slate-100 tracking-tight">Editor de Facturas</h3>
    </div>

    @if (facturas().length > 0) {
      <span class="text-xs text-slate-400 font-semibold px-2.5 py-0.5 bg-slate-950/60 rounded-xl border border-slate-800/80 font-mono transition-all animate-[fadeIn_0.2s_ease-out]">
        Total: <span class="text-emerald-400 font-bold">Q.{{ formatNumber(totalSum()) }}</span>
      </span>
    }

    <span class="px-2.5 py-1 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-[10px] font-extrabold rounded-lg">
      {{ facturas().length }} Cargada(s)
    </span>
  </div>

  <div class="flex flex-col gap-3">
    <!-- Lista de Facturas en Acordeón -->
    @for (fact of facturas(); track fact.id; let idx = $index) {
      <app-tarjeta-factura
        [factura]="fact"
        [selectedId]="selectedId()"
        [index]="idx"
        [totalInvoices]="facturas().length"
        (invoiceSelected)="selectInvoice($event)"
        (invoiceDeleted)="deleteInvoice($event)"
        (invoiceUpdated)="invoiceUpdated.emit($event)"
        (attachPdf)="attachPdf.emit($event)"
      ></app-tarjeta-factura>
    }

    <!-- Botones para Añadir Factura (Manual o PDF) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-2 w-full">
      <button 
        type="button" 
        (click)="addInvoice()"
        class="btn btn-sm btn-outline btn-primary border-dashed rounded-2xl cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        + Factura Manual
      </button>

      <button 
        type="button" 
        (click)="pdfFileInput.click()"
        class="btn btn-sm btn-outline btn-secondary border-dashed rounded-2xl cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" />
        </svg>
        + Cargar PDFs
      </button>
      
      <input 
        #pdfFileInput
        type="file" 
        accept="application/pdf" 
        multiple
        (change)="onPdfsUploaded(pdfFileInput.files); pdfFileInput.value = ''" 
        class="hidden" 
      />
    </div>
  </div>
</div>
