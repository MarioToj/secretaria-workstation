<div class="bg-slate-900/60 backdrop-blur-md border border-slate-800/85 rounded-3xl p-6 shadow-2xl h-auto xl:h-full flex flex-col min-h-0 print:border-none print:bg-white print:p-0 print:shadow-none transition-all duration-300 hover:border-slate-800">
  
  <!-- Mensaje de Validación de Solicitantes (Ocultar al imprimir) -->
  @if (showValidationError()) {
    <div class="p-3 mb-3 bg-amber-950/40 border border-amber-800/80 text-amber-300 rounded-2xl flex gap-3 text-[11px] items-start justify-between print:hidden shrink-0 animate-[fadeIn_0.15s_ease-out]">
      <div class="flex gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 shrink-0 text-amber-400">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
        </svg>
        <div>
          <p class="font-bold uppercase tracking-wide">Acción Bloqueada</p>
          <p class="mt-0.5 text-amber-400/90 leading-normal">{{ validationErrorMsg() }}</p>
        </div>
      </div>
      <button (click)="showValidationError.set(false)" class="text-amber-400 hover:text-amber-200 font-bold px-1.5 py-0.5 hover:bg-amber-500/10 rounded-lg cursor-pointer">
        Cerrar
      </button>
    </div>
  }

  <!-- Barra de Controles Compacta (Ocultar al imprimir) -->
  <app-agreement-controls
    [activeTab]="activeTab()"
    (activeTabChange)="activeTab.set($event)"
    [selectedPageSize]="selectedPageSize()"
    (selectedPageSizeChange)="onPageSizeChange($event)"
    [showMargins]="showMargins()"
    (showMarginsChange)="showMargins.set($event)"
    [marginTop]="marginTop()"
    (marginTopChange)="marginTop.set($event)"
    [marginBottom]="marginBottom()"
    (marginBottomChange)="marginBottom.set($event)"
    [marginLeft]="marginLeft()"
    (marginLeftChange)="marginLeft.set($event)"
    [marginRight]="marginRight()"
    (marginRightChange)="marginRight.set($event)"
    (exportWord)="exportToWord($event)"
    (printPdf)="printPdf()"
  ></app-agreement-controls>

  <!-- Contenedor del Documento -->
  <div class="flex-1 min-h-0 overflow-y-auto p-5 bg-slate-950/45 border border-slate-800/60 rounded-2xl select-text print:p-0 print:bg-transparent print:border-none">
    <!-- Vista Previa Compilada (Con formato HTML y hojas de estilo que emulan papel) -->
    @if (activeTab() === 'preview') {
      <div 
        [style.--preview-padding]="getPreviewPadding()"
        [style.font-family]="fontStack()"
        [style.font-size.pt]="fontSizeGeneral()"
        class="preview-container bg-white text-slate-900 border border-slate-200/80 rounded-xl min-h-[500px] h-auto shadow-[0_15px_30px_rgba(0,0,0,0.35)] text-justify print:border-none print:p-0 print:shadow-none print:text-black mx-auto w-full max-w-[800px] transition-all duration-300"
        [style.line-height]="lineSpacing()"
      >
        <app-agreement-certification
          [certificar]="certificar()"
          [numeroActa]="numeroActa()"
          [tipoSesion]="tipoSesion()"
          [fechaSesion]="fechaSesion()"
          [fechaCertificacion]="fechaCertificacion()"
          [cierreCertificacionText]="cierreCertificacionText()"
          [fontSizeCert]="fontSizeCert()"
          [fontSizeCierreCert]="fontSizeCierreCert()"
        >
          <app-agreement-invoices
            [facturas]="facturas()"
            [puntoActa]="puntoActa()"
            [encabezado]="encabezado()"
            [cierre]="cierre()"
            [fontSizeIncisos]="fontSizeIncisos()"
          ></app-agreement-invoices>
        </app-agreement-certification>

        @if (certificar()) {
          <app-agreement-signatures
            [nombreSecretaria]="nombreSecretaria()"
            [nombreAlcalde]="nombreAlcalde()"
            [espacioFirmas]="espacioFirmas()"
            [fontSizeFirmas]="fontSizeFirmas()"
            [lineSpacing]="lineSpacing()"
          ></app-agreement-signatures>
        }
      </div>
    }

    <!-- Editor Libre (Para cambios finos directos en el texto final) -->
    @if (activeTab() === 'editor') {
      <div class="h-full flex flex-col gap-2 min-h-[600px] print:hidden">
        <div class="flex items-center justify-between text-xs text-slate-500 font-medium px-1">
          <span>Puedes usar marcas **texto** para negrita en este editor.</span>
          <button 
            (click)="resetManualText()"
            class="text-indigo-400 hover:text-indigo-300 font-semibold"
          >
            Regenerar desde Formulario
          </button>
        </div>
        <textarea 
          [(ngModel)]="manualText"
          class="flex-1 w-full p-6 bg-slate-950 border border-slate-800 text-slate-300 font-mono text-sm leading-relaxed rounded-2xl outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/30 focus-visible:border-indigo-500 resize-none select-text"
          placeholder="Escribe o edita el acuerdo libremente aquí…"
        ></textarea>
      </div>
    }
  </div>

</div>
