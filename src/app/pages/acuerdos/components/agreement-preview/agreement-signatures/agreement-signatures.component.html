<table border="0" cellpadding="0" cellspacing="0" style="width: 100%; table-layout: fixed; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; mso-table-bspace: 0pt; mso-table-tspace: 0pt; mso-border-alt: none; mso-border-insideh: none; mso-border-insidev: none; border: 1px none; border-top: 1px none; border-bottom: 1px none; border-left: 1px none; border-right: 1px none;" class="mt-4 print:mt-16 select-text">
  <tr [style.font-size.pt]="fontSizeFirmas()">

      <p style="text-align: center; margin: 0;">
        <span [innerHTML]="espacioFirmasBr()"></span>

      </p>
    </td>

    <td style="width: 2.9in; padding: 0; color: #000; vertical-align: top; mso-border-alt: none; mso-border-left-alt: none; mso-border-top-alt: none; mso-border-bottom-alt: none; mso-border-right-alt: none; border: 1px none; border-top: 1px none; border-bottom: 1px none; border-left: 1px none; border-right: 1px none;" [style.line-height]="lineSpacing()">
      <p style="text-align: center; margin: 0;">
        <span [innerHTML]="espacioFirmasBr()"></span>
        Vo. Bo. &nbsp; <strong>{{ nombreAlcalde() }}</strong><br/>
        <span style="font-size: 0.85em; opacity: 0.8;">Alcalde Municipal</span>
      </p>
    </td>
  </tr>
</table>
