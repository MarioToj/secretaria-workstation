<div class="flex flex-col gap-1.5 p-4 bg-slate-950/40 border border-slate-800/80 rounded-2xl">
  <label class="text-xs font-semibold text-slate-300 flex justify-between items-center">
    <span>Perfil de Extracción / Formato</span>
    <span class="text-[10px] text-indigo-400 font-mono">Guardado local</span>
  </label>
  
  <div class="flex gap-2">
    <div class="flex-1">
      <select 
        [ngModel]="selectedProfileName()" 
        (ngModelChange)="selectProfile($event)"
        class="select select-bordered select-sm w-full bg-slate-950 text-slate-200 rounded-xl focus-visible:ring-2 focus-visible:ring-indigo-500/30 focus-visible:border-indigo-500 outline-none transition-all cursor-pointer font-bold"
      >
        <option value="Por defecto">Por defecto (Estándar FEL)</option>
        @if (selectedProfileName() === 'Personalizado') {
          <option value="Personalizado">Personalizado (Sin Guardar)</option>
        }
        @for (profile of savedProfiles(); track profile.name) {
          <option [value]="profile.name">{{ profile.name }}</option>
        }
      </select>
    </div>
    
    <!-- Actions on Selected Profile -->
    <div class="flex gap-1.5">
      <!-- Overwrite profile (only visible for saved custom profiles) -->
      @if (selectedProfileName() !== 'Por defecto' && selectedProfileName() !== 'Personalizado') {
        <button 
          (click)="saveCurrentProfile()"
          title="Guardar cambios en este perfil"
          class="btn btn-square btn-sm btn-ghost text-emerald-400 hover:text-emerald-300 border border-slate-800 rounded-xl cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
          </svg>
        </button>
        
        <button 
          (click)="deleteProfile()"
          title="Eliminar este perfil"
          class="btn btn-square btn-sm btn-ghost text-rose-400 hover:text-rose-300 border border-slate-800 rounded-xl cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
          </svg>
        </button>
      }
      
      <button 
        (click)="showSaveAsNewForm.set(!showSaveAsNewForm())"
        title="Guardar como nuevo perfil"
        class="btn btn-square btn-sm btn-primary rounded-xl cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Formulario para Guardar Nuevo Perfil -->
  @if (showSaveAsNewForm()) {
    <div class="mt-3 pt-3 border-t border-slate-800/80 flex flex-col gap-2">
      <span class="text-xs font-medium text-slate-400">Nombre del nuevo perfil:</span>
      <div class="flex gap-2">
        <input 
          type="text" 
          [ngModel]="newProfileName()"
          (ngModelChange)="newProfileName.set($event)"
          placeholder="Ej. Constructora Milder"
          class="input input-bordered input-xs flex-1 bg-slate-950 text-slate-200 rounded-lg focus-visible:ring-2 focus-visible:ring-indigo-500/30 focus-visible:border-indigo-500 outline-none"
        />
        <button 
          (click)="saveAsNewProfile()"
          class="btn btn-xs btn-primary rounded-lg cursor-pointer"
        >
          Guardar
        </button>
        <button 
          (click)="showSaveAsNewForm.set(false)"
          class="btn btn-xs btn-outline rounded-lg cursor-pointer"
        >
          Cancelar
        </button>
      </div>
    </div>
  }
</div>
